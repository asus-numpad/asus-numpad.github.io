<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<meta name="robots" content="noindex">
<title>404 · asus-numpad</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<style>
  :root {
    --bg: #f7f8fa; --surface: #fff; --line: rgba(16,18,27,.1);
    --text: #14161f; --text-2: #4d5262; --text-3: #5f6470;
    --btn-a: #c0143c; --btn-b: #9c0f30; --radius: 14px;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "Inter", "Noto Sans SC",
            "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0a0b0f; --surface: #12141a; --line: rgba(255,255,255,.09);
      --text: #eceef4; --text-2: #a9adba; --text-3: #8f95a4;
      --btn-a: #d81b45; --btn-b: #b3123a;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 32px;
    background: var(--bg); color: var(--text); font-family: var(--font);
    -webkit-font-smoothing: antialiased;
  }
  .box {
    width: 100%; max-width: 520px; text-align: center;
    border: 1px solid var(--line); border-radius: 18px; background: var(--surface);
    padding: 40px 32px 36px;
  }
  .brand { display: inline-flex; align-items: center; gap: 9px; font-weight: 650; font-size: 14.5px; }
  .brand img { display: block; }
  .code { margin: 26px 0 0; font-family: var(--mono); font-size: 13px; letter-spacing: .18em; color: var(--text-3); }
  h1 { margin: 10px 0 0; font-size: 24px; line-height: 1.3; letter-spacing: -.015em; }
  .sub { margin: 8px 0 0; font-size: 13.5px; color: var(--text-2); }
  .links { margin-top: 26px; display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; align-items: center; }
  .btn {
    display: inline-block; padding: 10px 18px; border-radius: 10px; text-decoration: none;
    color: #fff; font-size: 14px; font-weight: 600;
    background: linear-gradient(180deg, var(--btn-a), var(--btn-b));
  }
  .lnk { color: var(--text-2); font-size: 13.5px; text-decoration: none; border-bottom: 1px solid var(--line); }
  .lnk:hover, .btn:hover { opacity: .88; }
  a:focus-visible { outline: 2px solid var(--btn-a); outline-offset: 3px; border-radius: 6px; }
</style>
</head>
<body>
  <div class="box">
    <div class="brand">
      <img src="/assets/logo.svg" alt="" width="26" height="26">
      <span>asus-numpad</span>
    </div>
    <p class="code">404</p>
    <h1>This page does not exist</h1>
    <p class="sub">页面不存在 · 頁面不存在</p>
    <div class="links">
      <a class="btn" href="/">Back to the site</a>
      <a class="lnk" href="https://github.com/asus-numpad/asus-numpad">GitHub</a>
      <a class="lnk" href="https://github.com/asus-numpad/asus-numpad/blob/main/docs/install.md">Install guide</a>
    </div>
  </div>
</body>
</html>
